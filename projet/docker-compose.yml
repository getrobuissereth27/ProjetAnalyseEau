services:
  mongodb:
    image: mongo:7
    container_name: eau-mongodb-v2
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"

  backend:
    build: ./backend
    container_name: eau-backend-v2
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/eau
      JWT_SECRET: change-moi-en-une-longue-chaine-aleatoire
      PORT: 3000
      CORS_ORIGIN: http://localhost:5174
      NODE_ENV: production
      # Emails d'alerte capturés par Mailpit (voir ci-dessous) : rien n'est
      # réellement envoyé, tout est consultable sur http://localhost:8025
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3002:3000"

  # Fausse boîte mail de test : reçoit tous les emails d'alerte et les affiche
  # dans une interface web (http://localhost:8025), sans jamais les envoyer.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: eau-mailpit-v2
    restart: unless-stopped
    ports:
      - "8025:8025"

  frontend:
    build:
      context: ./frontend
      args:
        # Vue depuis le navigateur sur ta machine -> le port publié (3002),
        # PAS le nom du service Docker "backend" (qui n'existe que dans le réseau interne)
        VITE_API_URL: http://localhost:3002
    container_name: eau-frontend-v2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

  # Client Raspberry Pi en mode simulation : envoie des mesures aléatoires
  # réalistes toutes les 10 s, pour voir le tableau de bord évoluer sans matériel.
  # Avec le vrai Raspberry Pi branché, arrête-le : docker compose stop simulateur
  simulateur:
    build: ./raspberry-client
    container_name: eau-simulateur-v2
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Réseau interne Docker : nom du service + port interne (pas 3002)
      API_URL: http://backend:3000
      INTERVALLE_SECONDES: 10

volumes:
  mongo_data:
