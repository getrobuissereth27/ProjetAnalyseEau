server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sert index.html pour toute route inconnue (nécessaire si des pages
    # supplémentaires avec routage côté client sont ajoutées plus tard)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
